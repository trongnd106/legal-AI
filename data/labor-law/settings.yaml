# GraphRAG settings — Trợ lý Ảo Luật Lao Động Việt Nam
# Skill 02 / Checklist 2.5
# Chạy: .venv/bin/graphrag index --root data/labor-law

# ─── LLM (completion) — OpenRouter ───────────────────────────────────────────
completion_models:
  default_completion_model:
    type: litellm
    model_provider: openrouter
    model: openai/gpt-4o-mini
    auth_method: api_key
    api_key: ${OPENROUTER_API_KEY}
    api_base: https://openrouter.ai/api/v1
    max_tokens: 4000
    temperature: 0
    concurrent_requests: 1
    request_timeout: 60.0
    retry:
      type: exponential_backoff
      max_retries: 2
# ─── Embedding — OpenRouter ──────────────────────────────────────────────────
embedding_models:
  default_embedding_model:
    type: litellm
    model_provider: openrouter
    model: qwen/qwen3-embedding-4b
    auth_method: api_key
    api_key: ${OPENROUTER_API_KEY}
    api_base: https://openrouter.ai/api/v1
    concurrent_requests: 4
    request_timeout: 30.0
    retry:
      type: exponential_backoff
      max_retries: 2
# ─── Vector store — PHẢI khớp dim embedding ─────────────────────────────────
vector_store:
  vector_size: 2560

# ─── Input — đọc JSONL từ chunks/ (output của 01_prepare_data.py) ────────────
# Mỗi record JSONL = 1 Điều luật, có field: id, van_ban, so_dieu, tieu_de,
# chuong_so, ten_chuong, muc_so, norm_type, noi_dung, khoans[]
input:
  type: jsonl           # đọc file .jsonl (json lines)
  file_pattern: ".*\\.jsonl$$"
  id_column: id           # dùng field "id" (vd. BLLĐ_2019_Điều_35) làm document id
  title_column: tieu_de   # dùng field "tieu_de" làm tiêu đề
  text_column: noi_dung   # dùng field "noi_dung" làm nội dung gửi vào LLM

input_storage:
  type: file
  base_dir: "chunks"      # data/labor-law/chunks/*.jsonl

output_storage:
  type: file
  base_dir: "output"

# ─── Cache — LLM cache tồn tại qua nhiều lần chạy (quan trọng cho free tier) ─
cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

# ─── Chunking ────────────────────────────────────────────────────────────────
# Mỗi Điều trung bình ~800 tokens; Điều dài nhất ~3000 tokens.
# size=4000 đảm bảo 1 Điều = 1 chunk, không bao giờ cắt giữa Khoản.
# overlap=0: mỗi Điều là unit pháp lý độc lập.
chunking:
  size: 2000
  overlap: 0

# ─── Extract graph (entity + relationship trong 1 prompt) ────────────────────
# Lớp 1 (VanBan, Dieu, Khoan…) KHÔNG đưa vào đây — build deterministic bởi
# scripts/01_prepare_data.py + scripts/02_merge_structural_graph.py.
extract_graph:
  prompt: "prompts/extract_graph_simple.txt"   # simplified prompt — domain rules + JSON output
  entity_types:
    # Lớp 2A — Ngữ nghĩa pháp lý
    - ChuThe             # NLĐ, NSDLĐ, người học nghề
    - HanhVi             # hành vi/sự kiện được điều chỉnh
    - CoQuan             # cơ quan NN thực thi
    # Lớp 2B — Domain lao động Tier 1
    - HopDongLaoDong
    - TienLuong
    - TraLuong
    - ThoiGioLamViec
    - NghiPhep
    - XuLyKyLuat
    - CheDoBaoHiem
    - TroCapThoiViec
    - CheTai
    - AnToanVeSinhLaoDong
    # Tier 2 — bật khi mở rộng corpus
    # - TranhChapLaoDong
    # - ThoaUocTapThe
    # - DieuKienLamViec
    # - ThoiHan
  max_gleanings: 1        # 1 = 2 LLM calls/chunk; giảm từ 2 để tiết kiệm ~30% requests

# ─── Summarize descriptions ──────────────────────────────────────────────────
# Gộp mô tả nhiều chunk cho cùng 1 entity/relation → 1 câu tóm tắt
summarize_descriptions:
  max_length: 500         # token tối đa cho mỗi summary

# ─── Community reports ───────────────────────────────────────────────────────
community_reports:
  graph_prompt: "prompts/community_report_labor.txt"
  max_length: 2000
  max_input_length: 8000

# ─── Local Search ────────────────────────────────────────────────────────────
# Giảm context window để tránh request timeout và tăng tốc phản hồi.
# Dataset lớn (5120 entities, 7890 relationships) → cần giới hạn chặt.
local_search:
  text_unit_prop: 0.4          # 40% context dành cho text units (default 0.5)
  community_prop: 0.1          # 10% cho community reports (default 0.15)
  top_k_entities: 10           # top-K entities ánh xạ (default 10)
  top_k_relationships: 10      # top-K relationships (default 10)
  max_context_tokens: 6000     # giảm từ 12000 → nhanh hơn ~2x, ít RAM hơn

# ─── Global Search ───────────────────────────────────────────────────────────
global_search:
  max_context_tokens: 6000
  data_max_tokens: 6000
  map_max_length: 1000
  reduce_max_length: 2000
