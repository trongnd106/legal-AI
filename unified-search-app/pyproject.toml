[project]
name = "unified-copilot"
version = "1.0.0"
description = ""
authors = [
    {name = "GraphRAG team"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "pdfplumber~=0.11",
    "python-docx~=1.1",
    "json-repair~=0.30",
    "neo4j>=5.0,<7",
    "python-dotenv>=1.0,<2",
    "streamlit==1.43.0",
    "azure-search-documents~=11.4",
    "azure-storage-blob~=12.20",
    "azure-identity~=1.16",
    # Dùng graphrag trong monorepo (cùng schema settings.yaml với index từ source).
    # graphrag==2.5.0 trên PyPI không đọc được cache: json / vector_store lancedb.
    "graphrag",
    "altair~=5.3",
    "streamlit-agraph~=0.0.45",
    "st-tabs~=0.1",
    "spacy~=3.8",
]

[tool.uv.sources]
graphrag = { path = "../packages/graphrag" }

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.0.0,<4",
    "paddleocr>=2.7.0,<3",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "poethepoet~=0.26",
    "ipykernel~=6.29",
    "pyright~=1.1",
    "ruff~=0.8",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["images*"]

[tool.poe.tasks]
start = "streamlit run app/home_page.py"
start_prod = "streamlit run app/home_page.py --server.port=8501 --server.address=0.0.0.0"

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
# Tests chạy với PYTHONPATH=app; Pyright cần extraPaths để resolve ``contract_analysis``.
extraPaths = ["app"]
